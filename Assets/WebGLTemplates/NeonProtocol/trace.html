<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEON PROTOCOL · Neon Signature</title>
<meta name="description" content="A NEON PROTOCOL run turned into a Neon Signature. Can you beat it?">
<meta property="og:title" content="NEON PROTOCOL · Neon Signature">
<meta property="og:description" content="Steal the Core, paint the vault, leave your trace on Monad. Can you beat this run?">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="TemplateData/neon.css">
<link rel="stylesheet" href="TemplateData/neon-astra.css">
<link rel="stylesheet" href="TemplateData/neon-raku.css">
<style>
  body { margin: 0; min-height: 100vh; background: radial-gradient(1200px 700px at 70% 10%, #24124a 0%, #0a0a1c 55%, #05050d 100%); color: var(--white); font-family: var(--ui); }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 28px 28px 60px; }
  header { display: flex; align-items: center; gap: 14px; margin-bottom: 26px; }
  header img { width: 44px; height: 44px; }
  header .t { font-family: var(--display); font-size: 22px; letter-spacing: .14em; }
  header .t b { color: var(--pink); }
  header a { margin-left: auto; color: var(--cyan); text-decoration: none; font-weight: 700; letter-spacing: .12em; font-size: 13px; }
  .grid { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, .95fr); gap: 26px; }
  @media (max-width: 920px) { .grid { grid-template-columns: 1fr; } }
  .card { padding: 22px; }
  canvas#art { width: 100%; height: auto; border-radius: 10px; display: block; }
  .kicker { font-size: 12px; letter-spacing: .26em; color: var(--muted); font-weight: 700; }
  h1 { font-family: var(--display); font-size: clamp(30px, 4vw, 46px); margin: 6px 0 4px; letter-spacing: .04em; overflow-wrap: anywhere; }
  .time { font-family: var(--mono); font-size: clamp(38px, 5vw, 60px); color: var(--cyan); text-shadow: 0 0 24px rgba(51,233,241,.45); }
  .badge { display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: 999px; font-size: 12px; letter-spacing: .14em; font-weight: 800; margin: 12px 0 4px; }
  .badge.ok { background: rgba(66,230,171,.12); border: 1px solid var(--green); color: var(--green); }
  .badge.local { background: rgba(255,203,97,.1); border: 1px solid var(--gold); color: var(--gold); }
  .stats { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; margin: 18px 0; }
  .stat { background: rgba(255,255,255,.03); border: 1px solid rgba(145,88,255,.25); border-radius: 10px; padding: 12px 14px; min-width: 0; }
  .stat .l { font-size: 11px; letter-spacing: .2em; color: var(--muted); font-weight: 700; }
  .stat .v { font-size: 20px; font-weight: 700; margin-top: 4px; overflow-wrap: anywhere; }
  .proof { font-family: var(--mono); font-size: 12px; color: var(--muted); line-height: 1.7; overflow-wrap: anywhere; }
  .proof a { color: var(--cyan); }
  .btns { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
  .b { appearance: none; border: 1.5px solid var(--line); background: rgba(255,255,255,.04); color: var(--white); padding: 13px 18px; border-radius: 10px; font: 800 13px var(--ui); letter-spacing: .14em; cursor: pointer; text-decoration: none; }
  .b.primary { background: linear-gradient(90deg, #ff3ecc, #9158ff); border-color: transparent; }
  .b.cyan { border-color: var(--cyan); color: var(--cyan); }
  .b[disabled] { opacity: .45; cursor: not-allowed; }
  .note { font-size: 13px; color: var(--muted); line-height: 1.6; margin-top: 14px; }
  .err { color: var(--red); }
</style>
<script src="config.js"></script>
</head>
<body>
<div class="wrap">
  <header><img class="wordmark" src="TemplateData/icons/wordmark.svg" alt="NEON PROTOCOL"><a href="halloffame.html">HALL OF FAME →</a></header>
  <div class="grid">
    <div class="card glass"><canvas id="art"></canvas></div>
    <div class="card glass" id="info"><div class="kicker">NEON SIGNATURE</div><h1>Loading…</h1></div>
  </div>
</div>
<script type="module">
import { renderSignature, hexToBytes, decode, summarize } from "./TemplateData/signature.js";
import { CFG, readLocalPayload, relayGet, fmtTime, esc, registeredTraceUrl, localTraceUrl, challengeUrl, xIntent, siteBase } from "./TemplateData/social.js";

const info = document.getElementById("info"), canvas = document.getElementById("art");
const qs = new URLSearchParams(location.search), id = Number(qs.get("id") || 0);
const local = location.hash.startsWith("#r=") ? readLocalPayload(location.hash.slice(3)) : null;

function stat(l, v) { return `<div class="stat"><div class="l">${l}</div><div class="v">${v}</div></div>`; }

async function main() {
  let rec, view;
  if (id) {
    // registered record: read back from Monad through the relay (the relay verifies the art against the stored hash)
    const t = await relayGet(`/trace/${id}`);
    const bytes = hexToBytes(t.art); rec = decode(bytes);
    view = { bytes, name: t.name, timeMs: Number(t.timeMs), registered: true, id, player: t.player, attested: t.attested, artHash: t.artHash, txHash: t.txHash, block: t.blockNumber, challengeOf: Number(t.challengeOf || 0) };
  } else if (local) {
    const bytes = hexToBytes(local.a); rec = decode(bytes);
    view = { bytes, name: local.n, timeMs: local.t, registered: false, stats: local.s, date: local.d };
  } else throw new Error("No run in this link.");

  renderSignature(canvas, view.bytes, { id: view.registered ? view.id : 0, name: view.name, status: view.registered ? `REGISTERED ON ${CFG.network.toUpperCase()}` : "LOCAL RUN · NOT REGISTERED", hash: view.artHash });
  const sm = summarize(rec), st = view.stats || {};
  const url = view.registered ? registeredTraceUrl(view.id) : location.href;
  const text = view.registered ? `I stole the Core in ${fmtTime(view.timeMs)} and my Neon Signature #${view.id} is recorded on Monad. Can you beat it?`
                               : `I stole the Core in ${fmtTime(view.timeMs)} in NEON PROTOCOL. Can you beat my run?`;
  function rulesOf(v) { return +(v.rulesVersion || (rec && rec.rulesVersion) || 1); }   // registered record, else the art bytes
  document.title = `${view.name} · ${fmtTime(view.timeMs)} · NEON PROTOCOL`;
  info.innerHTML = `
    <div class="kicker">NEON SIGNATURE ${view.registered ? "#" + view.id : ""}</div>
    <h1>${esc(view.name || "Runner")}</h1>
    <div class="time">${fmtTime(view.timeMs)}</div>
    ${view.registered ? `<div class="badge ok">● REGISTERED · ${esc(CFG.network.toUpperCase())}${view.attested ? " · RELAY-ACCEPTED SESSION" : " · SELF-SUBMITTED"}</div>`
                      : `<div class="badge local">● LOCAL RUN · NOT REGISTERED ON MONAD</div>`}
    <div class="stats">
      ${stat("RULES", rulesOf(view) === 1 ? "v1 · full adventure" : "v" + rulesOf(view) + " · featured route")}${stat("RELAYS ONLINE", `${sm.relays} / ${rulesOf(view) === 1 ? 3 : 1}`)}${stat("ENERGY SHARDS", st.sh ?? sm.shards)}
      ${stat("RIVALS TAGGED", st.rv ?? sm.rivals)}${stat("TIMES TAGGED OUT", st.tg ?? sm.taggedOut)}
      ${stat("PAINT HITS RECORDED", sm.paint)}${stat("FINALITY RUN", sm.rode ? "COMPLETED" : "—")}
    </div>
    ${view.registered ? `<div class="proof">player ${esc(view.player)}<br>art hash ${esc(view.artHash)}<br>${view.txHash ? `tx <a href="${CFG.explorer}/tx/${view.txHash}" target="_blank" rel="noopener">${esc(view.txHash.slice(0, 18))}… ↗</a>` : ""}${view.block ? ` · block ${view.block}` : ""}</div>`
                      : `<div class="note">This link carries the run inside it. It is not verified: only runs registered on Monad appear in the Hall of Fame and can be challenged. ${esc(view.date || "")}</div>`}
    <div class="btns">
      ${view.registered ? `<a class="b primary" href="${challengeUrl(view.id)}">PLAY THIS CHALLENGE</a>` : `<a class="b primary" href="index.html">PLAY NEON PROTOCOL</a>`}
      <button class="b cyan" id="copy">COPY LINK</button>
      <a class="b" target="_blank" rel="noopener" href="${xIntent(text, url)}">SHARE ON X</a>
      <button class="b" id="png">DOWNLOAD IMAGE</button>
    </div>`;
  document.getElementById("copy").onclick = async (e) => { try { await navigator.clipboard.writeText(url); e.target.textContent = "LINK COPIED"; } catch { prompt("Copy this link", url); } };
  document.getElementById("png").onclick = () => { const a = document.createElement("a"); a.download = `neon-signature-${view.registered ? view.id : "local"}.png`; a.href = canvas.toDataURL("image/png"); a.click(); };
}
main().catch(e => { info.innerHTML = `<div class="kicker">NEON SIGNATURE</div><h1>Not available</h1><p class="err">${esc(e.message)}</p><div class="btns"><a class="b primary" href="index.html">PLAY NEON PROTOCOL</a><a class="b" href="halloffame.html">HALL OF FAME</a></div>`; });
</script>
</body>
</html>
